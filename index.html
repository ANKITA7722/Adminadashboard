<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
   
    <div id="sidebar" class="sidebar">
        <div class="logo">
            <h2>LOGO</h2>
            <button id="close-btn" class="close-btn">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        <ul class="menu-items">
            <li><a href="#"><i class="fa-solid fa-laptop"></i> Dashboard</a></li>
            <li><a href="#"><i class="fa-solid fa-user"></i> Login Page</a></li>
            <li><a href="#"><i class="fa-solid fa-list"></i> Display Data</a></li>
            <li><a href="#"><i class="fa-solid fa-slack"></i> Insert Data</a></li>
            <li><a href="#"><i class="fa-solid fa-universal-access"></i> Update Data</a></li>
            <li><a href="#"><i class="fa-solid fa-chart-pie"></i> Logout</a></li>
            <li><a href="#"><i class="fa-solid fa-chart-pie"></i> Signup</a></li>
        </ul>
    </div>

    
    <div id="main-content" class="main-content">
        <div class="navbar">
            <button id="toggle-btn" class="toggle-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="search">
                <input type="text" placeholder="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="profile">
                <i class="fa-regular fa-bell"></i>
                <img src="/IMG-ankita.jpg" alt="Profile">
            </div>
        </div>

        <div class="content">
            <h1>Welcome User</h1>
            <div class="values">
                <div class="val-box">
                    <i class="fa-solid fa-users"></i>
                    <div>
                        <h3>8,289</h3>
                        <span>New Users</span>
                    </div>
                </div>
                <div class="val-box">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <div>
                        <h3>2,521</h3>
                        <span>Total Orders</span>
                    </div>
                </div>
                <div class="val-box">
                    <i class="fa-solid fa-shield"></i>
                    <div>
                        <h3>2,542</h3>
                        <span>Products Sold</span>
                    </div>
                </div>
                <div class="val-box">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <div>
                        <h3>$6,895</h3>
                        <span>This Month</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
